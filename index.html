<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FretFlow - Up-the-Neck Picking Guide</title>
    <style>
        body { font-family: sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, button { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #2b6cb0; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px;}
        button:hover { background-color: #2c5282; }
        #results { margin-top: 30px; background: #f7fafc; padding: 20px; border: 1px solid #e2e8f0; border-radius: 4px; white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>

    <h1>🎸 FretFlow</h1>
    <p>Smart up-the-neck guitar voicings and custom picking patterns.</p>

    <div class="form-group">
        <label for="chords">Chord Progression</label>
        <input type="text" id="chords" placeholder="e.g. D - G - Em - A or C - G - D - A">
    </div>

    <div class="form-group">
        <label for="tuning">Tuning</label>
        <select id="tuning">
            <option value="Standard (EADGBE)">Standard (EADGBE)</option>
            <option value="Drop D (DADGBE)">Drop D (DADGBE)</option>
            <option value="Open G (DGDGBD)">Open G (DGDGBD) - 'Keith Richards'</option>
            <option value="DADGAD">DADGAD</option>
            <option value="Double Drop D (DADGBD)">Double Drop D (DADGBD)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="capo">Capo Position</label>
        <select id="capo">
            <option value="None">No Capo</option>
            <option value="1st Fret">1st Fret</option>
            <option value="2nd Fret">2nd Fret</option>
            <option value="3rd Fret">3rd Fret</option>
            <option value="4th Fret">4th Fret</option>
            <option value="5th Fret">5th Fret</option>
            <option value="7th Fret">7th Fret</option>
        </select>
    </div>

    <div class="form-group">
        <label for="style">Picking Style</label>
        <select id="style">
            <option value="Travis Fingerpicking">Travis Fingerpicking</option>
            <option value="Mellow 6/8 Arpeggio">Mellow 6/8 Arpeggio</option>
            <option value="Up-the-Neck Movable Triads">Up-the-Neck Movable Triads / Voice Leading</option>
            <option value="Acoustic Strum & Fill">Acoustic Strum & Fill</option>
        </select>
    </div>

    <div class="form-group">
        <label for="apiKey">OpenRouter / API Key</label>
        <input type="password" id="apiKey" placeholder="sk-or-v1-...">
    </div>

    <button onclick="generateArrangement()">Generate Arrangement</button>

    <div id="results">Your custom tab and up-the-neck voicings will appear here...</div>

    <script>
        async function generateArrangement() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const chords = document.getElementById('chords').value;
            const tuning = document.getElementById('tuning').value;
            const capo = document.getElementById('capo').value;
            const style = document.getElementById('style').value;
            const resultsDiv = document.getElementById('results');

            if (!apiKey) {
                alert('Please enter your API Key!');
                return;
            }
            if (!chords) {
                alert('Please enter a chord progression!');
                return;
            }

            resultsDiv.innerText = "Connecting to Claude 3.5 Sonnet...";

            const prompt = `You are an expert guitar master and teacher specializing in fingerpicking, open tunings, and up-the-neck voice leading.
            
User Request:
- Chord Progression: ${chords}
- Tuning: ${tuning}
- Capo Position: ${capo}
- Desired Style: ${style}

Please provide:
1. **Up-the-Neck Voicings:** Instead of basic 1st-fret open chords, give 2-3 logical, comfortable movable chord shapes higher up the fretboard that flow naturally into each other (smooth voice leading).
2. **Fret Diagrams:** Express these voicings clearly using tab/fret numbers relative to the capo/tuning.
3. **Custom Picking Tab:** Write out a clean ASCII guitar tab for a 1-to-2 bar picking pattern for this progression in the requested style.
4. **Playing Tip:** Give 1 specific tip on hand position or string transition for this arrangement.`;

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'FretFlow'
                    },
                    body: JSON.stringify({
                        model: 'anthropic/claude-3.5-sonnet',
                        messages: [{ role: 'user', content: prompt }]
                    })
                });

                const data = await response.json();

                if (data.choices && data.choices[0]) {
                    resultsDiv.innerText = data.choices[0].message.content;
                } else if (data.error) {
                    resultsDiv.innerText = "API Error:\n" + data.error.message;
                } else {
                    resultsDiv.innerText = "Unexpected Response:\n" + JSON.stringify(data, null, 2);
                }
            } catch (err) {
                resultsDiv.innerText = "Connection Error:\n" + err.message;
            }
        }
    </script>
</body>
</html>
